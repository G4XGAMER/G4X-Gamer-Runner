<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>G4X Gamer Runner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050507;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#40101888,#050507 65%);pointer-events:auto}.panel{width:min(92vw,420px);padding:24px;border:1px solid #ff263b66;border-radius:22px;background:#090a0de8;box-shadow:0 20px 80px #000;color:#fff;text-align:center}.logo{font-size:42px;font-weight:1000;letter-spacing:3px;color:#fff;text-shadow:3px 3px 0 #e21c2e}.sub{color:#b9bbc5;margin:6px 0 20px}.input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #383a43;background:#111218;color:#fff;font-size:16px;outline:none}.btn{margin-top:12px;width:100%;padding:14px;border:0;border-radius:12px;background:#ef1f36;color:#fff;font-weight:900;font-size:16px}.btn.secondary{background:#1b1c23;border:1px solid #343640}.board{margin:18px 0 4px;text-align:left;border-top:1px solid #292a31}.row{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid #292a31;color:#ddd}.hud{position:absolute;top:14px;left:14px;right:14px;display:none;justify-content:space-between;align-items:center;font-weight:900}.pill{background:#090a0dcc;border:1px solid #ffffff18;padding:9px 12px;border-radius:12px}.pause{pointer-events:auto;cursor:pointer}.controls{position:absolute;bottom:18px;left:0;right:0;display:none;justify-content:center;gap:18px;pointer-events:auto}.ctrl{width:64px;height:58px;border-radius:18px;border:1px solid #ffffff22;background:#090a0dcc;color:#fff;font-size:26px;font-weight:900}.ctrl.jump{width:84px;background:#ef1f36}.hint{font-size:12px;color:#8e919d;margin-top:12px}.gameover{display:none}.loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:12px;background:#090a0de8;border:1px solid #ffffff18;z-index:20}
</style>
</head>
<body>
<div class="loading" id="loading">Loading G4X character…</div>
<div id="ui">
  <div class="hud" id="hud"><div class="pill">SCORE <span id="score">0</span> • COINS <span id="coins">0</span></div><button class="ctrl pause" id="pause">Ⅱ</button></div>
  <div class="controls" id="controls"><button class="ctrl" id="left">‹</button><button class="ctrl jump" id="jump">JUMP</button><button class="ctrl" id="right">›</button></div>
  <section class="screen" id="lobby"><div class="panel"><div class="logo">G4X GAMER</div><div class="sub">RUNNER</div><input class="input" id="name" maxlength="14" placeholder="Enter username"><button class="btn" id="start">START RUN</button><div class="board"><div style="padding:12px 4px 7px;font-weight:900">LEADERBOARD</div><div id="boardRows"></div></div><div class="hint">Swipe left/right • tap JUMP • keyboard arrows/W/space</div></div></section>
  <section class="screen gameover" id="over"><div class="panel"><div class="logo" style="font-size:34px">GAME OVER</div><div class="sub">Score: <b id="finalScore">0</b> • Coins: <b id="finalCoins">0</b></div><button class="btn" id="retry">RUN AGAIN</button><button class="btn secondary" id="home">LOBBY</button></div></section>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const RUN='assets/Meshy_AI_Crimson_Voltage_Gamer_biped_Animation_Running_withSkin.glb';
let scene,camera,renderer,clock,mixer,player,runAction,game=false,paused=false;
let lane=1,targetX=0,jumpY=0,vy=0,score=0,coins=0,speed=18,spawn=0,coinSpawn=0,last=0;
const obstacles=[],coinObjs=[],road=[];
const $=id=>document.getElementById(id);
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x050507);scene.fog=new THREE.Fog(0x050507,25,115);
 camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);camera.position.set(0,4.1,8.5);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
 const hemi=new THREE.HemisphereLight(0xffdfe3,0x15151b,2.2);scene.add(hemi);
 const key=new THREE.DirectionalLight(0xff3b4f,3.5);key.position.set(5,12,7);key.castShadow=true;scene.add(key);
 const red=new THREE.PointLight(0xff152b,18,35);red.position.set(0,3,-18);scene.add(red);
 const roadMat=new THREE.MeshStandardMaterial({color:0x17181e,roughness:.9});
 for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(9,.25,10),roadMat);m.position.set(0,-.25,-i*10+10);m.receiveShadow=true;scene.add(m);road.push(m)}
 for(const x of [-1.45,1.45]){const m=new THREE.Mesh(new THREE.BoxGeometry(.06,.03,120),new THREE.MeshBasicMaterial({color:0xff2439}));m.position.set(x,-.08,-50);scene.add(m)}
 const loader=new GLTFLoader();
 $('loading').textContent='Downloading G4X character…';
 fetch(R,{cache:'no-store'}).then(r=>{
  if(!r.ok) throw new Error('Character HTTP '+r.status);
  return r.arrayBuffer();
 }).then(data=>{
  $('loading').textContent='Loading G4X character…';
  loader.parse(data,'./',g=>{
   player=g.scene;
   player.scale.setScalar(1.65);
   player.position.set(0,0,2);
   player.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
   scene.add(player);
   mixer=new THREE.AnimationMixer(player);
   const clip=THREE.AnimationClip.findByName(g.animations,'Running')||g.animations[0];
   if(clip) runAction=mixer.clipAction(clip);
   runAction?.play();
   $('loading').style.display='none';
  },e=>{
   $('loading').textContent='G4X character parse error';
   console.error(e);
  });
 }).catch(e=>{
  $('loading').textContent='G4X character load error: '+e.message;
  console.error(e);
 });
 clock=new THREE.Clock();addEvents();animate();
}
function addEvents(){
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 $('start').onclick=()=>startGame();$('retry').onclick=()=>startGame();$('home').onclick=()=>showLobby();$('pause').onclick=()=>{paused=!paused; $('pause').textContent=paused?'▶':'Ⅱ'};
 $('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('jump').onclick=jump;
 addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.key==='ArrowUp'||e.key===' '||e.key.toLowerCase()==='w')jump();if(e.key==='Escape')paused=!paused});
 let sx=0;addEventListener('touchstart',e=>{if(e.touches[0])sx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{if(!game||!e.changedTouches[0])return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>35)move(dx>0?1:-1);else jump()},{passive:true});
}
function move(d){if(!game||paused)return;lane=THREE.MathUtils.clamp(lane+d,0,2);targetX=(lane-1)*2.2}
function jump(){if(!game||paused||jumpY>.05)return;vy=8.8}
function startGame(){if(!player)return;clearObjects();game=true;paused=false;lane=1;targetX=0;player.position.set(0,0,2);jumpY=0;vy=0;score=0;coins=0;speed=18;spawn=.5;coinSpawn=.3;$('score').textContent=0;$('coins').textContent=0;$('lobby').style.display='none';$('over').style.display='none';$('hud').style.display='flex';$('controls').style.display='flex';$('pause').textContent='Ⅱ'}
function showLobby(){$('over').style.display='none';$('lobby').style.display='flex';$('hud').style.display='none';$('controls').style.display='none';renderBoard()}
function clearObjects(){for(const o of obstacles)scene.remove(o);for(const o of coinObjs)scene.remove(o);obstacles.length=0;coinObjs.length=0}
function spawnObstacle(){const x=(Math.floor(Math.random()*3)-1)*2.2;const h=.9+Math.random()*.65;const o=new THREE.Mesh(new THREE.BoxGeometry(1.7,h,1.15),new THREE.MeshStandardMaterial({color:0x9b1020,roughness:.65,metalness:.25}));o.position.set(x,h/2,-85);o.castShadow=true;scene.add(o);obstacles.push(o)}
function spawnCoin(){const x=(Math.floor(Math.random()*3)-1)*2.2;const c=new THREE.Mesh(new THREE.TorusGeometry(.34,.10,10,22),new THREE.MeshStandardMaterial({color:0xffd22e,emissive:0x6a3c00,emissiveIntensity:1.2,metalness:.6}));c.rotation.y=Math.PI/2;c.position.set(x,1.25+Math.random()*.9,-85);scene.add(c);coinObjs.push(c)}
function hit(a,b,dist=.9){return Math.abs(a.x-b.x)<dist&&Math.abs(a.z-b.z)<1.0&&Math.abs(a.y-b.y)<1.5}
function endGame(){game=false;runAction?.stop();const n=$('name').value.trim()||'G4X Player';let arr=JSON.parse(localStorage.getItem('g4xRunnerScores')||'[]');arr.push({name:n,score:Math.floor(score)});arr.sort((a,b)=>b.score-a.score);localStorage.setItem('g4xRunnerScores',JSON.stringify(arr.slice(0,10)));$('finalScore').textContent=Math.floor(score);$('finalCoins').textContent=coins;$('over').style.display='flex';$('hud').style.display='none';$('controls').style.display='none';renderBoard()}
function renderBoard(){const arr=JSON.parse(localStorage.getItem('g4xRunnerScores')||'[]');$('boardRows').innerHTML=arr.length?arr.slice(0,5).map((x,i)=>`<div class="row"><span>#${i+1} ${String(x.name).replace(/[<>]/g,'')}</span><b>${x.score}</b></div>`).join(''):'<div class="row"><span>No runs yet</span><b>—</b></div>'}
function update(dt){if(!game||paused||!player)return;score+=dt*speed*.75;speed=Math.min(30,speed+dt*.35);$('score').textContent=Math.floor(score);
 player.position.x+=(targetX-player.position.x)*Math.min(1,dt*9);vy-=20*dt;jumpY+=vy*dt;if(jumpY<0){jumpY=0;vy=0}player.position.y=jumpY;
 mixer?.update(dt);
 spawn-=dt;if(spawn<=0){spawnObstacle();spawn=.65+Math.random()*.55-(speed-18)*.008}
 coinSpawn-=dt;if(coinSpawn<=0){spawnCoin();coinSpawn=.35+Math.random()*.45}
 for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.position.z+=speed*dt;if(o.position.z>12){scene.remove(o);obstacles.splice(i);continue}if(hit(player.position,o.position,.95)&&jumpY<1.15){endGame();return}}
 for(let i=coinObjs.length-1;i>=0;i--){const c=coinObjs[i];c.position.z+=speed*dt;c.rotation.x+=dt*6;if(c.position.z>12){scene.remove(c);coinObjs.splice(i);continue}if(Math.abs(player.position.x-c.position.x)<.9&&Math.abs(player.position.z-c.position.z)<1.2&&Math.abs(jumpY+1-c.position.y)<1.2){coins++;$('coins').textContent=coins;score+=20;scene.remove(c);coinObjs.splice(i)}}
 for(const r of road)r.position.z+=speed*dt;if(road[0].position.z>15){const r=road.shift();r.position.z-=120;road.push(r)}
 const camTarget=new THREE.Vector3(player.position.x*.35,2.0,player.position.z-6);camera.position.x+=(player.position.x*.35-camera.position.x)*dt*4;camera.lookAt(camTarget);
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera)}
init();renderBoard();
</script></body></html>
