<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>G4X GAMER — 3D Runner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,470px);padding:28px 24px;background:rgba(8,8,11,.92);border:1px solid #7d1425;border-radius:22px;box-shadow:0 0 40px rgba(255,20,50,.15);backdrop-filter:blur(10px);z-index:5}.logo{font-size:38px;font-weight:900;letter-spacing:3px;text-align:center;text-shadow:3px 3px #ef1735}.sub{text-align:center;color:#aaa;margin:5px 0 22px}.field{width:100%;padding:15px 16px;border-radius:13px;border:1px solid #333;background:#111217;color:#fff;font-size:17px;outline:none}.field:focus{border-color:#ef1735}.btn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:13px;background:#ef1735;color:#fff;font-weight:900;font-size:17px}.btn:active{transform:scale(.98)}.leader{margin-top:24px;border-top:1px solid #25252a;padding-top:18px}.leader h3{margin:0 0 10px}.row{display:flex;justify-content:space-between;padding:7px 4px;color:#ccc}.hint{text-align:center;color:#777;font-size:13px;margin-top:18px}.hidden{display:none!important}.hud{position:fixed;left:0;right:0;top:0;padding:12px 14px;display:flex;justify-content:space-between;pointer-events:none;z-index:3}.pill{background:rgba(5,5,8,.7);border:1px solid #4b101b;border-radius:14px;padding:9px 12px;font-weight:800}.pause{position:fixed;right:14px;top:68px;z-index:4;background:rgba(5,5,8,.75);border:1px solid #4b101b;color:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:4;pointer-events:none}.ctrl{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid #741426;background:rgba(7,7,10,.7);color:#fff;font-size:27px;font-weight:900}.jump{width:82px;border-radius:20px;font-size:15px}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#0a0a0d;color:#fff;border:1px solid #57101d;border-radius:15px;padding:16px 20px;z-index:10;display:none;text-align:center}.small{font-size:12px;color:#999;margin-top:8px}.gameover{text-align:center}.scorebig{font-size:42px;font-weight:900;margin:10px 0}.bar{height:5px;background:#19191d;border-radius:5px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:100%;background:#ef1735;transform-origin:left}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#050507;z-index:20}.loadingBox{text-align:center}.spinner{width:42px;height:42px;border:4px solid #2a0d13;border-top-color:#ef1735;border-radius:50%;margin:0 auto 15px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading" class="loading"><div class="loadingBox"><div class="spinner"></div><b>Loading G4X 3D character…</b><div class="small">First load can take a few seconds.</div></div></div>
<div id="lobby" class="panel hidden">
  <div class="logo">G4X GAMER</div><div class="sub">3D RUNNER</div>
  <input id="name" class="field" maxlength="16" placeholder="Enter username" />
  <button id="start" class="btn">START RUN</button>
  <div class="leader"><h3>LEADERBOARD</h3><div id="scores"></div></div>
  <div class="hint">Swipe / buttons = change lane · tap JUMP</div>
</div>
<div id="hud" class="hud hidden"><div class="pill">🏆 <span id="score">0</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">🪙 <span id="coins">0</span></div></div>
<button id="pause" class="pause hidden">Ⅱ</button>
<div id="controls" class="controls hidden"><button id="left" class="ctrl">‹</button><button id="jump" class="ctrl jump">JUMP</button><button id="right" class="ctrl">›</button></div>
<div id="toast" class="toast"></div>
<div id="over" class="panel gameover hidden"><div class="logo" style="font-size:30px">GAME OVER</div><div class="scorebig" id="finalScore">0</div><div id="finalText" class="sub"></div><button id="retry" class="btn">RUN AGAIN</button><button id="home" class="btn" style="background:#1a1a20;border:1px solid #3b3b42">LOBBY</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x050507); scene.fog=new THREE.Fog(0x07070a,18,75);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.05,140); camera.position.set(0,3.2,8.8);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.6)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x777777,0x09090b,1.5));
const redLight=new THREE.PointLight(0xff1238,18,35); redLight.position.set(0,6,7); scene.add(redLight);
const backLight=new THREE.PointLight(0x991122,25,45); backLight.position.set(0,4,-15); scene.add(backLight);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,180),new THREE.MeshStandardMaterial({color:0x090a0d,roughness:.95,metalness:.15})); ground.rotation.x=-Math.PI/2; ground.position.z=-45; ground.receiveShadow=true; scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(8,180),new THREE.MeshStandardMaterial({color:0x101116,roughness:.9})); road.rotation.x=-Math.PI/2; road.position.y=.01; road.position.z=-45; scene.add(road);
const laneLines=[]; for(let i=0;i<30;i++){for(const x of [-1.33,1.33]){const m=new THREE.Mesh(new THREE.BoxGeometry(.035,.02,3),new THREE.MeshBasicMaterial({color:0x8b1327}));m.position.set(x,.035,-i*6);scene.add(m);laneLines.push(m)}}
// city silhouettes
for(let i=0;i<40;i++){for(const side of [-1,1]){const h=THREE.MathUtils.randFloat(3,12),w=THREE.MathUtils.randFloat(1.2,3.2);const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),new THREE.MeshStandardMaterial({color:side<0?0x11131a:0x151016,roughness:1}));b.position.set(side*THREE.MathUtils.randFloat(6,11),h/2,-i*5-8);scene.add(b)}}

let player, mixer, runAction; const loader=new GLTFLoader();
async function loadPlayer(){const gltf=await loader.loadAsync('assets/G4X_Running.glb'); player=gltf.scene; player.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true; o.material=new THREE.MeshStandardMaterial({color:0x1a0c11,roughness:.62,metalness:.3,emissive:0x220008,emissiveIntensity:.35})}}); const box=new THREE.Box3().setFromObject(player); const size=box.getSize(new THREE.Vector3()); const center=box.getCenter(new THREE.Vector3()); const scale=2.15/size.y; player.scale.setScalar(scale); player.position.set(0,-center.y*scale,0); scene.add(player); mixer=new THREE.AnimationMixer(player); if(gltf.animations.length){runAction=mixer.clipAction(gltf.animations[0]);runAction.play()} }

const clock=new THREE.Clock(); let running=false,paused=false,lane=0,targetX=0,vy=0,jumping=false,speed=.28,distance=0,score=0,coinCount=0,lives=3,spawnT=0,coinT=0,obstacles=[],coins=[]; const lanes=[-2.25,0,2.25];
function makeBarrier(z){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.25,.65),new THREE.MeshStandardMaterial({color:0x15161a,roughness:.55,metalness:.55,emissive:0x220008,emissiveIntensity:.5}));body.position.y=.63;g.add(body);for(const x of [-.55,0,.55]){const bar=new THREE.Mesh(new THREE.BoxGeometry(.16,1.45,.72),new THREE.MeshStandardMaterial({color:0xd31535,metalness:.5,emissive:0x6a0012,emissiveIntensity:1}));bar.position.set(x,.7,.01);g.add(bar)}g.position.set(lanes[Math.floor(Math.random()*3)],0,z);scene.add(g);obstacles.push(g)}
function makeCoin(z){const c=new THREE.Mesh(new THREE.TorusGeometry(.32,.11,12,24),new THREE.MeshStandardMaterial({color:0xff1739,emissive:0x99001c,emissiveIntensity:2,metalness:.6,roughness:.25}));c.rotation.x=Math.PI/2;c.position.set(lanes[Math.floor(Math.random()*3)],1.25,z);scene.add(c);coins.push(c)}
function resetWorld(){obstacles.forEach(o=>scene.remove(o));coins.forEach(o=>scene.remove(o));obstacles=[];coins=[];lane=0;targetX=0;vy=0;jumping=false;speed=.28;distance=0;score=0;coinCount=0;lives=3;spawnT=0;coinT=0;player.position.x=0;player.position.y=0;camera.position.set(0,3.2,8.8);}
function startGame(){const n=document.querySelector('#name').value.trim()||'G4X Player';localStorage.g4xLastName=n;document.querySelector('#lobby').classList.add('hidden');document.querySelector('#over').classList.add('hidden');document.querySelector('#hud').classList.remove('hidden');document.querySelector('#controls').classList.remove('hidden');document.querySelector('#pause').classList.remove('hidden');resetWorld();running=true;paused=false;}
function jump(){if(!running||paused||jumping)return;jumping=true;vy=.22}
function move(d){if(!running||paused)return;lane=Math.max(-1,Math.min(1,lane+d));targetX=lanes[lane+1]}
function hit(){lives--;document.querySelector('#lives').textContent=lives;if(lives<=0) endGame(); else toast('BARRIER HIT — LIFE LOST');}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',700)}
function endGame(){running=false;document.querySelector('#hud').classList.add('hidden');document.querySelector('#controls').classList.add('hidden');document.querySelector('#pause').classList.add('hidden');document.querySelector('#finalScore').textContent=Math.floor(score);const n=document.querySelector('#name').value.trim()||'G4X Player';document.querySelector('#finalText').textContent=`${n} collected ${coinCount} coins`;saveScore(n,Math.floor(score));document.querySelector('#over').classList.remove('hidden');renderScores();}
function saveScore(n,s){const a=JSON.parse(localStorage.g4xScores||'[]');a.push({n,s});a.sort((x,y)=>y.s-x.s);localStorage.g4xScores=JSON.stringify(a.slice(0,8))}
function renderScores(){const a=JSON.parse(localStorage.g4xScores||'[]');document.querySelector('#scores').innerHTML=a.length?a.map((x,i)=>`<div class="row"><span>${i+1}. ${escapeHtml(x.n)}</span><b>${x.s}</b></div>`).join(''):'<div class="row"><span>No runs yet</span><span>—</span></div>'}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function update(dt){if(!running||paused)return;distance+=speed;score+=dt*10+speed*3;speed=Math.min(.52,speed+dt*.004);spawnT-=dt;coinT-=dt;if(spawnT<=0){makeBarrier(-65);spawnT=Math.max(.55,1.25-speed*1.2)}if(coinT<=0){makeCoin(-48);coinT=.65}for(const o of obstacles){o.position.z+=speed*dt*60}for(const c of coins){c.position.z+=speed*dt*60;c.rotation.z+=dt*4}obstacles=obstacles.filter(o=>{if(o.position.z>12){scene.remove(o);return false}const dz=Math.abs(o.position.z);const dx=Math.abs(o.position.x-player.position.x);if(dz<1.05&&dx<.8&&player.position.y<.9){scene.remove(o);hit();return false}return true});coins=coins.filter(c=>{if(c.position.z>12){scene.remove(c);return false}const dz=Math.abs(c.position.z);const dx=Math.abs(c.position.x-player.position.x);if(dz<1&&dx<.8&&Math.abs(player.position.y+1.25)<1.6){coinCount++;score+=50;document.querySelector('#coins').textContent=coinCount;scene.remove(c);return false}return true});player.position.x+=(targetX-player.position.x)*Math.min(1,dt*9);if(jumping){player.position.y+=vy*dt*60;vy-=.012*dt*60;if(player.position.y<=0){player.position.y=0;jumping=false;vy=0}}camera.position.x+=(player.position.x*.45-camera.position.x)*Math.min(1,dt*5);camera.lookAt(player.position.x*.25,1.15,-8);document.querySelector('#score').textContent=Math.floor(score);for(const l of laneLines){l.position.z+=speed*dt*60;if(l.position.z>10)l.position.z-=180}}
function animate(){requestAnimationFrame(animate);const dt=Math.min(.035,clock.getDelta());if(mixer&&running&&!paused)mixer.update(dt);update(dt);renderer.render(scene,camera)}

document.querySelector('#start').onclick=startGame;document.querySelector('#retry').onclick=startGame;document.querySelector('#home').onclick=()=>{document.querySelector('#over').classList.add('hidden');document.querySelector('#lobby').classList.remove('hidden');renderScores()};document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);document.querySelector('#jump').onclick=jump;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'};window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key===' '||e.key==='ArrowUp')jump();if(e.key==='p')document.querySelector('#pause').click()});let sx=0;renderer.domElement.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});renderer.domElement.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)move(dx>0?1:-1);else jump()},{passive:true});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderScores();document.querySelector('#name').value=localStorage.g4xLastName||'';
loadPlayer().then(()=>{document.querySelector('#loading').classList.add('hidden');document.querySelector('#lobby').classList.remove('hidden');animate()}).catch(err=>{console.error(err);document.querySelector('#loading').innerHTML='<div class="loadingBox"><b>Character load failed</b><div class="small">Make sure assets/G4X_Running.glb is beside index.html.</div></div>';animate()});
</script></body></html>
